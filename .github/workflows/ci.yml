name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync ruff check src tests scripts main.py setup.py comprehensive_analysis.py examples
      - run: uv run --frozen --no-sync pytest --cov=src --cov-report=term-missing
      - run: uv build
      - run: uv run --frozen --no-sync twine check dist/*
      - run: bash -n run.sh scripts/run_full_analysis.sh
