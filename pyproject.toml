[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentir"
requires-python = ">=3.10"
dynamic = ["version", "description", "readme", "dependencies", "authors", "classifiers", "urls", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5",
    "build>=1.2", "twine>=6", "ruff>=0.8", "coverage>=7.10",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
patch = ["subprocess"]
relative_files = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
